<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LFB iOS Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      button {
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #00aa00;
        color: #fff;
        font-size: 16px;
      }
      button.secondary {
        background: #333;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 22px;
      }
      h2 {
        margin: 24px 0 12px;
        font-size: 17px;
      }
      .screen {
        display: none;
        box-sizing: border-box;
        min-height: 100%;
        padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px);
      }
      #boot-error {
        display: none;
        margin: 0 0 16px;
        padding: 12px;
        border-radius: 8px;
        background: #3a1414;
        color: #ffb4b4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #flavors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      #flavors button:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
      #history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #history-header button {
        padding: 6px 10px;
        font-size: 14px;
      }
      #history-empty {
        color: #999;
        font-size: 14px;
      }
      #history {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      #history th,
      #history td {
        padding: 10px 6px;
        border-bottom: 1px solid #2a2a2a;
        text-align: left;
        vertical-align: middle;
      }
      #history th {
        color: #999;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }
      #history .json-toggle {
        padding: 6px 10px;
        background: #333;
        font-size: 13px;
        white-space: nowrap;
      }
      #history .json-row td {
        padding: 0 0 12px;
      }
      #history .json-row pre {
        margin: 0;
        padding: 12px;
        overflow: auto;
        border-radius: 8px;
        background: #1c1c1c;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <section id="home" class="screen">
      <pre id="boot-error"></pre>
      <h1>LFB iOS Demo</h1>
      <div id="flavors">
        <button type="button" data-mode="document">Receipt</button>
        <button type="button" data-mode="long_document">Long receipt</button>
        <button type="button" data-mode="checks">Check</button>
        <button type="button" data-mode="anydocs">Anydocs</button>
        <button type="button" data-mode="decoupled_document">Decoupled receipt</button>
      </div>
      <div id="history-header">
        <h2>Submitted this session</h2>
        <button id="history-clear" class="secondary" type="button">Clear</button>
      </div>
      <p id="history-empty">Nothing submitted yet.</p>
      <table id="history">
        <thead>
          <tr>
            <th>Flavor</th>
            <th>Captured</th>
            <th>Doc ID</th>
            <th>JSON</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <script type="module" src="/main.js"></script>
  </body>
</html>
